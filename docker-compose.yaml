name: discord-bot-backend

services:
  schema-migrate:
    container_name: schema-migrate
    restart: "no"
    build:
      context: .
      dockerfile: ./deployments/docker/migrations/Dockerfile
    env_file: .env

  api:
    container_name: api
    build:
      context: .
      dockerfile: ./deployments/docker/web/Dockerfile
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
    env_file: ./services/web/.env
    ports:
      - "8080:8080"

  workers:
    container_name: workers
    build:
      context: .
      dockerfile: ./deployments/docker/cron/Dockerfile
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
    env_file: ./services/cron/.env
